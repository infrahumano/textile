[project]
name = "textile"
version = "0.1.0"
description = "Generate and explore grid-based textile patterns from binary seeds"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
  { name = "Javier" }
]
keywords = ["generative-art", "textile", "grid", "visualization", "numpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Artistic Software",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
]

[project.scripts]
textile = "textile.cli:main"

[project.urls]
Repository = "https://github.com/infrahumano/textile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
