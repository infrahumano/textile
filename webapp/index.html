<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="dedication" content="this is for sarah warren">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>textile</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    h1 { font-family: 'Playfair Display', Georgia, serif; }
  </style>
</head>
<body>
  <header>
    <h1>textile</h1>
    <div class="controls">
      <div class="field">
        <label for="size">size</label>
        <input id="size" type="number" min="4" max="100" value="40">
      </div>
      <div class="field">
        <label for="strategy">colouring</label>
        <select id="strategy">
          <option value="random">random</option>
          <option value="greedy">minimal</option>
        </select>
      </div>
      <button id="btn-randomise">randomise</button>
      <button id="btn-colour">colour</button>
      <button id="btn-palette">palette</button>
      <button id="btn-lines">lines</button>
      <button id="btn-download">download oxs</button>
      <button id="btn-png">download png</button>
    </div>
  </header>

  <main>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <p id="stats"></p>
  </main>

  <footer>this is for sarah warren</footer>

  <div id="palette-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div id="palette-swatches" class="palette-swatches"></div>
      <div class="modal-actions">
        <button id="btn-palette-reset">reset</button>
        <button id="btn-palette-set">set</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/infrahumano/puntada@v0.1.0/puntada.js"></script>
  <script src="textile.js"></script>
  <script src="app.js"></script>
</body>
</html>
